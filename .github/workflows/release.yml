name: Release

# Cuts a GitHub Release every time a feat: or fix: commit lands on main,
# AND bumps the version in apps/desktop/package.json, kova_cli/__init__.py,
# and pyproject.toml by one patch, regenerates uv.lock, and publishes a real
# GitHub Release with a proper changelog.
#
# IMPORTANT: this workflow must NOT re-fire when an automatic release tag
# (v*) is pushed back to the repo, or it loops forever with version drift.
# The `if` clause at job level filters tag pushes out.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/package.json'
      - 'kova_cli/__init__.py'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4+"

      - name: Compute new version
        id: bump
        run: |
          set -euo pipefail
          BUMP="${{ inputs.bump || 'patch' }}"
          OLD=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          IFS=. read -r MAJOR MINOR PATCH <<< "$OLD"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "old=$OLD"
          echo "new=$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Write new versions
        run: |
          python << 'PY'
          import os, re, json
          from pathlib import Path
          root = Path('.')
          new = "${{ steps.bump.outputs.version }}"
          pp = root / 'pyproject.toml'
          pp.write_text(re.sub(r'version = "[^"]+"', f'version = "{new}"', pp.read_text(), count=1))
          cli = root / 'kova_cli' / '__init__.py'
          cli.write_text(re.sub(r'__version__ = "[^"]+"', f'__version__ = "{new}"', cli.read_text(), count=1))
          pkg = root / 'apps' / 'desktop' / 'package.json'
          data = json.loads(pkg.read_text())
          data['version'] = new
          pkg.write_text(json.dumps(data, indent=2) + "\n")
          print(f'Wrote version {new}')
          PY

      - name: Regenerate uv.lock to match pyproject
        run: |
          uv lock --check || uv lock

      - name: Commit + push bumped versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/package.json kova_cli/__init__.py pyproject.toml uv.lock
          # Only commit if there are actual changes (skip if version was already correct)
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            echo "skip_commit=true" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }}"
            git push
            echo "skip_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect changelog since last release
        if: steps.commit.outputs.skip_commit != 'true'
        id: changelog
        run: |
          python << 'PY'
          import subprocess, os
          tag = subprocess.check_output(['git','describe','--tags','--abbrev=0'], text=True).strip()
          range_ = f"{tag}..HEAD"
          print(f"Using range: {range_}")
          log = subprocess.check_output(['git','log',range_,'--no-merges','--format=%s'], text=True)
          entries = [l.strip() for l in log.split("\n") if l.strip()]
          body = "\n".join(f"- {e}" for e in entries)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"body<<EOT\n{body}\nEOT\n")
          PY

      - name: Create GitHub Release
        if: steps.commit.outputs.skip_commit != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Kova Agent v${{ steps.bump.outputs.version }}
          body: |
            ## Changes since ${{ steps.changelog.outputs.body }}

            ## What's changed

            ${{ steps.changelog.outputs.body }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
